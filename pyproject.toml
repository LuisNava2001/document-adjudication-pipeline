[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-ai-adjudication-pipeline"
version = "0.1.0"
description = "Demonstration pipeline: synthetic document -> extraction -> validation -> decision -> audit trace."
readme = "README.md"
requires-python = ">=3.11"
# The runtime uses only the Python standard library.
dependencies = []

[project.scripts]
adjudication = "adjudication.cli:main"

[tool.setuptools.packages.find]
include = ["adjudication*"]

[tool.setuptools.package-data]
adjudication = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

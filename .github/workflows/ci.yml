name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # No dependencies to install: the runtime and the tests use the standard library only.
      - name: Unit, integration and golden tests
        run: python -m unittest discover -s tests -v

      - name: Demo batch over the synthetic samples
        run: python -m adjudication batch samples/claims --out demo-output --deterministic
